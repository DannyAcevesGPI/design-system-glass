<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<title>StatusChip — vista previa</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<script src="../../tailwind/vendor/tailwind-play-3.4.17.js"></script>
<script src="../../tailwind/play-config.js"></script>
</head>
<body class="dsg-mesh" style="margin:0">
<div class="dsg-glass" style="margin:20px;padding:20px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span class="dsg-chip">Planeado</span>
    <span class="dsg-chip dsg-chip--accent">En desarrollo</span>
    <span class="dsg-chip dsg-chip--warm">Piloto</span>
    <span class="dsg-chip dsg-chip--success">Liberado</span>
    <span class="dsg-chip dsg-chip--warm">Pendiente de revisión</span>
    <span class="dsg-chip dsg-chip--danger">Cambios solicitados</span>
    <span class="dsg-chip dsg-chip--admin">ADMIN</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px">
    <span class="dsg-tag">automatización</span><span class="dsg-tag">datos</span><span class="dsg-tag">IA aplicada</span>
  </div>
</div>
</body>
</html>
