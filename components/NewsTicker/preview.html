<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<title>NewsTicker — vista previa</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<script src="../../tailwind/vendor/tailwind-play-3.4.17.js"></script>
<script src="../../tailwind/play-config.js"></script>
</head>
<body class="dsg-mesh" style="margin:0">
<div class="dsg-glass" style="margin:20px;overflow:hidden">
  <div class="dsg-ticker" role="region" aria-label="Cinta de actualizaciones" style="border-top:0">
    <span class="dsg-ticker__label">Al día</span>
    <div class="dsg-ticker__viewport">
      <ul class="dsg-ticker__track" id="track">
        <li class="dsg-ticker__item"><span class="dsg-ticker__kind" style="--c:var(--dsg-success)">Liberación</span><a href="#" style="color:var(--dsg-ink);text-decoration:none">Asistente de documentación publica su versión 1.0</a></li>
        <li class="dsg-ticker__item"><span class="dsg-ticker__kind">Hito</span><a href="#" style="color:var(--dsg-ink);text-decoration:none">Piloto concluido en Finanzas</a></li>
        <li class="dsg-ticker__item"><span class="dsg-ticker__kind" style="--c:var(--dsg-warning)">Aviso</span><span>Ventana de mantenimiento el sábado</span></li>
        <li class="dsg-ticker__item" aria-hidden="true"><span class="dsg-ticker__kind" style="--c:var(--dsg-success)">Liberación</span><span>Asistente de documentación publica su versión 1.0</span></li>
        <li class="dsg-ticker__item" aria-hidden="true"><span class="dsg-ticker__kind">Hito</span><span>Piloto concluido en Finanzas</span></li>
        <li class="dsg-ticker__item" aria-hidden="true"><span class="dsg-ticker__kind" style="--c:var(--dsg-warning)">Aviso</span><span>Ventana de mantenimiento el sábado</span></li>
      </ul>
    </div>
    <div class="dsg-ticker__controls">
      <button type="button" class="dsg-btn dsg-btn--icon" style="background:transparent;color:var(--dsg-ink)" aria-label="Pausar cinta" aria-pressed="false" id="pause">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 5v14M16 5v14"></path></svg></button>
    </div>
  </div>
</div>
<script>
  var b = document.getElementById('pause'), t = document.getElementById('track');
  b.addEventListener('click', function () {
    var p = t.classList.toggle('is-paused');
    b.setAttribute('aria-pressed', String(p));
    b.setAttribute('aria-label', p ? 'Reanudar cinta' : 'Pausar cinta');
  });
</script>
</body>
</html>
